{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Digit Recognizer AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'api/css/style.css' %}" type="text/css" media="screen" title="no title" charset="utf-8">
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <header>
      <h1>Digit Recognizer <span>AI</span></h1>
      <p>Draw a digit (0-9) below and watch the neural network predict it in real-time.</p>
    </header>

    <div class="main-content">
      <!-- Drawing Area -->
      <div class="glass-panel canvas-panel">
        <canvas width="400" height="400"></canvas>
        <div class="actions">
          <button id="clear" class="btn btn-secondary">Clear Canvas</button>
          <button class="btn btn-primary" onclick="predict()">Predict Number</button>
        </div>
      </div>

      <!-- Results Area -->
      <div class="glass-panel results-panel">
        <h2>Prediction Results</h2>
        <div class="best-guess">
          <p>Most Probable Digit:</p>
          <div class="big-number" id="ans">?</div>
        </div>

        <div class="feedback-section" id="feedback-section" style="display: none;">
          <p>Was this correct?</p>
          <div class="feedback-buttons">
            <button class="btn-icon" onclick="feedbackCorrect()">👍</button>
            <button class="btn-icon" onclick="feedbackIncorrect()">👎</button>
          </div>
          <div id="correction-form" style="display: none;">
            <input type="number" id="correct-label" min="0" max="9" placeholder="Correct digit? (0-9)">
            <button class="btn btn-primary btn-small" onclick="submitFeedback()">Teach Model</button>
          </div>
        </div>

        <div class="probabilities">
          <div class="prob-row"><span class="digit">0</span><div class="bar-container"><div class="bar" id="bar-0"></div></div><span class="pct" id="0">0%</span></div>
          <div class="prob-row"><span class="digit">1</span><div class="bar-container"><div class="bar" id="bar-1"></div></div><span class="pct" id="1">0%</span></div>
          <div class="prob-row"><span class="digit">2</span><div class="bar-container"><div class="bar" id="bar-2"></div></div><span class="pct" id="2">0%</span></div>
          <div class="prob-row"><span class="digit">3</span><div class="bar-container"><div class="bar" id="bar-3"></div></div><span class="pct" id="3">0%</span></div>
          <div class="prob-row"><span class="digit">4</span><div class="bar-container"><div class="bar" id="bar-4"></div></div><span class="pct" id="4">0%</span></div>
          <div class="prob-row"><span class="digit">5</span><div class="bar-container"><div class="bar" id="bar-5"></div></div><span class="pct" id="5">0%</span></div>
          <div class="prob-row"><span class="digit">6</span><div class="bar-container"><div class="bar" id="bar-6"></div></div><span class="pct" id="6">0%</span></div>
          <div class="prob-row"><span class="digit">7</span><div class="bar-container"><div class="bar" id="bar-7"></div></div><span class="pct" id="7">0%</span></div>
          <div class="prob-row"><span class="digit">8</span><div class="bar-container"><div class="bar" id="bar-8"></div></div><span class="pct" id="8">0%</span></div>
          <div class="prob-row"><span class="digit">9</span><div class="bar-container"><div class="bar" id="bar-9"></div></div><span class="pct" id="9">0%</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'api/js/app.js'%}" type="text/javascript" charset="utf-8"></script>
  <script type="text/javascript">
    document.getElementById('clear').addEventListener('click', function () {
      var canvas = document.querySelector('canvas');
      var context = canvas.getContext('2d');
      context.fillStyle = "black";
      context.fillRect(0, 0, canvas.width, canvas.height);
      document.getElementById("ans").innerHTML = "?";
      document.getElementById("feedback-section").style.display = "none";
      document.getElementById("correction-form").style.display = "none";
      document.getElementById("correct-label").value = "";
      for (let i = 0; i < 10; i++) {
        document.getElementById(i).innerHTML = '0%';
        document.getElementById('bar-' + i).style.width = '0%';
        document.getElementById('bar-' + i).className = 'bar';
      }
    }, false);

    function predict() {
      var canvas = document.querySelector('canvas');
      var dataURL = canvas.toDataURL('image/png');

      fetch('/api/predict/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataURL })
      })
      .then(response => response.json())
      .then(data => {
        var best_index = data.prediction;
        document.getElementById("ans").innerHTML = best_index;
        
        // Show feedback section
        document.getElementById("feedback-section").style.display = "flex";
        document.getElementById("correction-form").style.display = "none";

        for (let i = 0; i < 10; i++) {
          let percentage = data.probabilities[i];
          document.getElementById(i).innerHTML = percentage + '%';
          let bar = document.getElementById('bar-' + i);
          bar.style.width = percentage + '%';
          
          if (i === best_index) {
            bar.className = 'bar best';
          } else {
            bar.className = 'bar';
          }
        }
      })
      .catch(error => {
        console.error('Error during prediction:', error);
      });
    }

    function feedbackCorrect() {
      document.getElementById('feedback-section').style.display = 'none';
    }

    function feedbackIncorrect() {
      document.getElementById('correction-form').style.display = 'flex';
    }

    function submitFeedback() {
      var correctLabel = document.getElementById('correct-label').value.trim();
      var predictedDigit = document.getElementById('ans').innerText.trim();

      if (correctLabel === '' || isNaN(correctLabel) || correctLabel < 0 || correctLabel > 9) {
        alert("Please enter a valid digit between 0 and 9.");
        return;
      }

      if (correctLabel === predictedDigit) {
        alert(`You marked "${predictedDigit}" as incorrect. The correct digit cannot be the same as the prediction!`);
        return;
      }
      
      var canvas = document.querySelector('canvas');
      var dataURL = canvas.toDataURL('image/png');

      fetch('/api/feedback/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataURL, correct_label: correctLabel })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
            alert('Model updated! Thanks for teaching it.');
            document.getElementById('clear').click(); // clear canvas
        } else {
            alert('Error updating model.');
        }
      })
      .catch(error => {
        console.error('Error during feedback submission:', error);
      });
    }
  </script>
</body>
</html>
